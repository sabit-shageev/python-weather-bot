volumes:
  postgres_data:


x-app: &app
  logging:
    driver: "json-file"
    options:
      max-file: "3"
      max-size: "10m"
  env_file:
    - .env
  restart: no

services:
  postgres:
    <<: *app
    image: postgres:14.0
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - ${POSTGRES_PORT}:5432

  redis:
    <<: *app
    image: redis:7.2.5
    ports:
      - ${REDIS_PORT}:6379
    restart: unless-stopped  

  weather_bot:
    <<: *app
    container_name: weather_bot
    build:
      context: ./
      dockerfile: src/Dockerfile
    environment:
      TZ: Europe/Moscow
    depends_on:
      - postgres
      - redis
